[project]
name = "churn-dashboard"
version = "2.0.0"
description = "Customer churn analytics: Power BI report rebuilt as a Streamlit app"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["archive"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
